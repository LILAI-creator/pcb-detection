<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCB缺陷检测 - 注册</title>
<base href="/static/">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.auth-card {
  width: 400px;
  max-width: 90vw;
  background: var(--surface);
  border-radius: var(--radius-xl);
  padding: 40px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}
.auth-logo {
  text-align: center;
  margin-bottom: 32px;
}
.auth-logo .icon {
  width: 56px;
  height: 56px;
  background: var(--primary);
  border-radius: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 12px;
}
.auth-logo h1 {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
}
.auth-logo p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font);
  background: var(--surface);
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--transition);
}
.form-input:focus {
  border-color: var(--primary);
}
.auth-btn {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
}
.auth-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-secondary);
}
.auth-footer a {
  color: var(--primary);
  font-weight: 500;
}
.error-msg {
  color: var(--danger);
  font-size: 13px;
  margin-top: 4px;
  display: none;
}
.error-msg.show {
  display: block;
}
.form-hint {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">P</div>
      <h1>PCB缺陷检测</h1>
      <p>创建新账号</p>
    </div>
    <form id="registerForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" class="form-input" id="username" placeholder="请输入用户名" autocomplete="username">
        <div class="form-hint">至少3个字符</div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="new-password">
        <div class="form-hint">至少6个字符</div>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password">
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn btn-primary auth-btn" id="registerBtn">注册</button>
    </form>
    <div class="auth-footer">
      已有账号？<a href="login.html">返回登录</a>
    </div>
  </div>
</div>

<script>
(function() {
  var token = localStorage.getItem('pcb_token');
  if (token) {
    window.location.href = 'index.html';
    return;
  }

  var form = document.getElementById('registerForm');
  var errorMsg = document.getElementById('errorMsg');
  var registerBtn = document.getElementById('registerBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }

  function hideError() {
    errorMsg.classList.remove('show');
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    hideError();

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirmPassword').value;

    if (!username || !password) {
      showError('请填写所有字段');
      return;
    }
    if (username.length < 3) {
      showError('用户名至少3个字符');
      return;
    }
    if (password.length < 6) {
      showError('密码至少6个字符');
      return;
    }
    if (password !== confirmPassword) {
      showError('两次密码输入不一致');
      return;
    }

    registerBtn.disabled = true;
    registerBtn.textContent = '注册中...';

    fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
    .then(function(res) {
      return res.json().then(function(data) {
        if (!res.ok) throw new Error(data.detail || '注册失败');
        return data;
      });
    })
    .then(function(data) {
      localStorage.setItem('pcb_token', data.token);
      localStorage.setItem('pcb_username', data.username);
      window.location.href = 'index.html';
    })
    .catch(function(err) {
      showError(err.message || '注册失败');
      registerBtn.disabled = false;
      registerBtn.textContent = '注册';
    });
  });
})();
</script>
</body>
</html>
